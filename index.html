<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Style Warrior - Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h1>My Todo Dashboard</h1>
        <button id="theme-toggle" class="btn" style="background-color: #f39c12; color: white;">Toggle Dark Mode</button>
    </header>

    <div class="layout-container">
        <aside>
            <div class="form-component">
                <h2>Create New Todo</h2>
                <form id="todo-form">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="What needs to be done?" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="3" placeholder="Add some details..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Add Todo</button>
                </form>
            </div>
        </aside>

        <main>
            <section class="panel-left">
                <h2>Todo List</h2>
                <ul class="todo-list" id="todo-list"></ul>
            </section>

            <section class="panel-right">
                <h2>Todo Details</h2>
                <div class="todo-detail-card" id="todo-detail-card">
                </div>
            </section>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Style Webpage. Built with HTML, CSS, & JS.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
